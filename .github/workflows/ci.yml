name: CI

on:
  push:
    branches: [main, 'phase/*']
  pull_request:
    branches: [main, 'phase/*', 'feature/*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-workflows:
    name: Lint GitHub Actions Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install actionlint v1.7.12
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 /usr/local/bin

      - name: Run actionlint
        run: actionlint .github/workflows/*.yml

  frontend:
    name: Frontend Lint, Typecheck, Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix apps/web ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & Adapter Tests
        run: npm run test

      - name: Build Standalone Web Bundle
        run: npm run build

      - name: Upload standalone bundle for the E2E job
        uses: actions/upload-artifact@v4
        with:
          name: standalone-frontend-dist
          path: dist/frontend
          if-no-files-found: error
          retention-days: 3

  rust:
    name: Rust Workspace Check & SQLCipher Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tauri & OpenSSL system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      - name: Build frontend dist for Tauri context
        run: |
          npm --prefix apps/web ci
          npm run build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cargo fmt (server)
        run: cargo fmt --check -p kanegrowth-api

      - name: Cargo clippy (server)
        run: cargo clippy -p kanegrowth-api --all-targets -- -D warnings

      - name: Cargo check workspace
        run: cargo check --workspace

      - name: Cargo test workspace
        run: cargo test --workspace

      - name: Cargo unit tests (server)
        run: cargo test -p kanegrowth-api

      - name: Cargo integration tests (server)
        run: cargo test -p kanegrowth-api --tests

      - name: Architecture boundary check
        run: cargo test -p kanegrowth-api --test 'arch_*'

  e2e:
    name: Playwright E2E (Desktop & Mobile)
    runs-on: ubuntu-latest
    needs: [frontend, rust]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix apps/web ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start full compose stack
        run: |
          VITE_OFFLINE_GRANT_PUBLIC_KEY="$(python3 -c 'import json;print(json.load(open("shared/fixtures/contract/offline-grant-test-keypair.json"))["publicKey"])')"
          export VITE_OFFLINE_GRANT_PUBLIC_KEY
          KANEGROWTH_OFFLINE_GRANT_PRIVATE_KEY="$(python3 -c 'import json;print(json.load(open("shared/fixtures/contract/offline-grant-test-keypair.json"))["privateKey"])')"
          export KANEGROWTH_OFFLINE_GRANT_PRIVATE_KEY
          docker compose up -d --build

      - name: Wait for composed frontend
        run: |
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8080/ >/dev/null && break
            sleep 2
          done

      - name: Run Web App Playwright E2E tests
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080
        run: npm --prefix apps/web run test:e2e

      - name: Teardown compose stack
        if: always()
        run: docker compose down

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-compose
          path: playwright-report/
          retention-days: 7

  e2e-standalone:
    name: Playwright E2E Standalone Suites (Desktop & Mobile)
    runs-on: ubuntu-latest
    needs: [frontend]
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix apps/web ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Download the prebuilt standalone bundle
        uses: actions/download-artifact@v4
        with:
          name: standalone-frontend-dist
          path: dist/frontend

      - name: Verify the standalone bundle is servable
        run: test -f dist/frontend/index.html

      - name: Run every root Playwright suite (Desktop & Mobile)
        env:
          CI: 'true'
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-standalone
          path: playwright-report/
          retention-days: 7

  container-build:
    name: Container Build (Single Image)
    runs-on: ubuntu-latest
    needs: [frontend, rust]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Single Container image
        run: docker build -t kanegrowth:ci .

  auto-tag:
    name: SemVer Auto-Tag & Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint-workflows, frontend, rust, e2e, e2e-standalone, container-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Auto-Tag
        uses: ajxcodes/auto-tag@v1
        with:
          package-json: "true"
          default-bump: patch
          tag-prefix: v
          version-format: standard
          create-release: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
