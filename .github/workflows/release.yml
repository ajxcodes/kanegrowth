name: Desktop Release (Manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  checksums:
    name: Verify Bundle & Generate SHA256 Checksums
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build standalone frontend bundle
        run: |
          npm --prefix apps/web ci
          npm run build

      - name: Generate SHA256SUMS and updater latest.json manifest
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p release-artifacts
          tar -czf "release-artifacts/kanegrowth-web-${RELEASE_TAG}.tar.gz" -C dist/frontend .
          (cd release-artifacts && sha256sum -- * > SHA256SUMS.txt)
          cat <<EOF > release-artifacts/latest.json
          {
            "version": "${RELEASE_TAG#v}",
            "notes": "KaneGrowth release ${RELEASE_TAG}",
            "platforms": {}
          }
          EOF
